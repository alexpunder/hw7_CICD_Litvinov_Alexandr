name: CI
on: [push, pull_request]

jobs:

  build_and_push_to_docker_hub:
    name: Push Docker image to DockerHub
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker 
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push to DockerHub
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: alexpunder/ml_pipeline:${{ secrets.MODEL_VERSION }}

  deploy:
    name: Deployment
    runs-on: ubuntu-latest
    needs: build_and_push_to_docker_hub
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3
      
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Pull image
        run: |
          docker pull alexpunder/ml_pipeline:${{ secrets.MODEL_VERSION }}

      - name: Run ML pipeline
        run: |
          echo "Запуск ML пайплайна..."
          docker run alexpunder/ml_pipeline:${{ secrets.MODEL_VERSION }}
          echo "Пайплайн успешно выполнен!"
